---
name: Run Go Tests
on:
  push:
  pull_request:
jobs:
  go_test:
    name: Go Tests
    runs-on: node-at-home
    steps:
      - id: checkout
        name: Checkout repository
        uses: https://codeberg.org/X_Cli/checkout@097cd845b48cfe9563da542dc8051b01aeb6346d
        with:
          repo-sha256: false
      - id: install_go
        name: Install Go
        uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25'
      - id: go_test
        name: Run tests
        run: cd tests && TF_ACC=1 go test -v .
